name: Test Live Audio Analyzer

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: |
          node --check worker.mjs
          node --check gemini-provider.mjs
          node --check public/app.js
          node --check public/metadata.js
      - name: Run integration tests (mock provider responses)
        run: npm test
