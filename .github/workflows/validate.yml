name: Validate prototype
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check sample-data.js
          node --check app.js
      - name: Validate required files and UI wiring
        run: |
          test -s index.html
          test -s styles.css
          test -s sample-data.js
          test -s app.js
          test -s docs/ARCHITECTURE.md
          grep -q 'sample-data.js' index.html
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
          echo "Prototype file checks passed."
